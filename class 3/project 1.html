<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Playground</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet"/>
    <style>
        body {background-color: antiquewhite ; padding: 20px; font-family: 'Limelight' ;}
        .box{width: 200px; padding: 20px; margin: 10px; color: white;}
        .a{background-color: tomato;text-align: center; border: 4px solid darkred;}
        .b{background: teal; text-align: center; text-transform: uppercase; border-radius: 12px;}
        .c{background: #444; text-align: center; box-shadow: 10px 4px 10px rgba(0, 0, 0, .3);}
    </style>
</head>
<body>
    <div class="box a">Border Box</div>
    <div class="box b">Rounded Box</div>
    <div class="box c">Shadow Box</div>
</body>
</html>

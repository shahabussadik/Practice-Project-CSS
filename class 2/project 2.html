<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"/>
    <style>
        body {font-family: 'Poppins', sans-serif;padding: 40px; background: #fafafa;}
        h1{font-family: 'Isometra', serif; font-size: 48px;color: #222;}
        h2{color: #d9534f; text-transform: uppercase; letter-spacing: 3px;}
        p{line-height: 1.7;color: #444; max-width: 600px;}
        p:first-of-type::first-letter{font-size: 40px;color: #d9534f;font-weight: bold;}
        a{color: #457b9d;}
        a:hover{color: #e63946; text-decoration: none;}
    </style>
</head>
<body>
    <h1>The Art of Typography</h1>
    <h2>Introduction</h2>
    <p>Typography is a technique to display the text beautifully. Good Typography helps a site to look professional</p>
    <p>For learning<a href="#">Click here</a></p>
</body>    
</html>

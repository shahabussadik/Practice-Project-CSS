<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>
    <style>
        body{font-family: sans-serif; text-align: center;}
        h1{color: #333; font-family: 'Times New Roman', Times, serif;}
        .box{width: 120px; height: 120px; display: inline-block; margin: 8px; color:white; line-height: 120px;}
        #red{background: red;}
        #blue{background: blue;}
        #black{background: black;}
        #green{background: #2a9d8f; color: black;}
        #yellow{background: #f4a261;color: #333;}
    </style>
</head>
<body>
    <h1>My Colors</h1>
    <div class="box" id="red">Red</div>
    <div class="box" id="black">Black</div>
    <div class="box" id="blue">Blue</div>
    <div class="box" id="green">Green</div>
    <div class="box" id="yellow">Yellow</div>
</body>
</html>
